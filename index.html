<script>
  function getTeamFlagUrl(teamName) {
    let name = teamName.toLowerCase().trim();
    if(name.includes('india')) return 'https://flagcdn.com/w40/in.png';
    if(name.includes('australia')) return 'https://flagcdn.com/w40/au.png';
    if(name.includes('pakistan')) return 'https://flagcdn.com/w40/pk.png';
    if(name.includes('south africa') || name.includes('sa')) return 'https://flagcdn.com/w40/za.png';
    if(name.includes('england')) return 'https://flagcdn.com/w40/gb-eng.png';
    if(name.includes('new zealand') || name.includes('nz')) return 'https://flagcdn.com/w40/nz.png';
    if(name.includes('sri lanka') || name.includes('sl')) return 'https://flagcdn.com/w40/lk.png';
    if(name.includes('bangladesh') || name.includes('ban')) return 'https://flagcdn.com/w40/bd.png';
    if(name.includes('afghanistan') || name.includes('afg')) return 'https://flagcdn.com/w40/af.png';
    if(name.includes('west indies') || name.includes('wi')) return 'https://flagcdn.com/w40/jm.png';
    if(name.includes('ireland')) return 'https://flagcdn.com/w40/ie.png';
    if(name.includes('zimbabwe')) return 'https://flagcdn.com/w40/zw.png';
    if(name.includes('netherlands')) return 'https://flagcdn.com/w40/nl.png';
    if(name.includes('scotland')) return 'https://flagcdn.com/w40/sc.png';
    if(name.includes('nepal')) return 'https://flagcdn.com/w40/np.png';
    if(name.includes('uae')) return 'https://flagcdn.com/w40/ae.png';
    if(name.includes('oman')) return 'https://flagcdn.com/w40/om.png';
    if(name.includes('hong kong')) return 'https://flagcdn.com/w40/hk.png';
    return 'https://flagcdn.com/w40/un.png';
  }

  function getSavedTable(key, defaultData) {
    let data = localStorage.getItem(key);
    if (!data) {
      localStorage.setItem(key, JSON.stringify(defaultData));
      return defaultData;
    }
    return JSON.parse(data);
  }

  function getSavedMatches() {
    let data = localStorage.getItem('cricket_matches');
    if (!data) {
      let initialDefault = [
        { id: 1, format: "1st ODI", series: "India Tour of Australia", t1: "India", t2: "Australia", venue: "Wankhede Stadium", date: "22 Nov 2026", time: "02:30 PM IST", toss: "" },

      ];
      localStorage.setItem('cricket_matches', JSON.stringify(initialDefault));
      return initialDefault;
    }
    return JSON.parse(data);
  }

  function saveMatches(matches) {

  // Render Functions
  function renderTables() {
    // Test Table (WTC: PCT sorting = (Pts / (Pld * 12)) * 100 or custom formula standard max points per match = 12)
    let testData = getSavedTable('cricket_test_table', defaultTestTeams);
    testData.sort((a, b) => {
      let pctA = a.pld > 0 ? (a.pts / (a.pld * 12)) * 100 : 0;
      let pctB = b.pld > 0 ? (b.pts / (b.pld * 12)) * 100 : 0;
      return pctB - pctA;
    });
    let testHtml = '';
    testData.forEach((item, index) => {
      let pct = item.pld > 0 ? ((item.pts / (item.pld * 12)) * 100).toFixed(2) : "0.00";
      testHtml += `<tr>
        <td>${index + 1}</td>
        <td><div class="team-info"><img class="flag-img" src="${getTeamFlagUrl(item.name)}"><div class="team-name-main">${item.name}</div></div></td>
        <td style="text-align:right; color:#555;">${item.pld}</td>
        <td style="text-align:right; color:#555;">${item.pts}</td>
        <td style="text-align:right; font-weight:600;">${pct}</td>
      </tr>`;
    });
    document.getElementById('testTbody').innerHTML = testHtml;

    // ODI Table (Rating = Pts / Pld rounded or standard ICC rating calculation representation)
    let odiData = getSavedTable('cricket_odi_table', defaultOdiTeams);
    odiData.sort((a, b) => {
      let ratA = a.pld > 0 ? Math.round(a.pts / a.pld) : 0;
      let ratB = b.pld > 0 ? Math.round(b.pts / b.pld) : 0;
      return ratB - ratA;
    });
    let odiHtml = '';
    odiData.forEach((item, index) => {
      let rating = item.pld > 0 ? Math.round(item.pts / item.pld) : 0;
      odiHtml += `<tr>
        <td>${index + 1}</td>
        <td><div class="team-info"><img class="flag-img" src="${getTeamFlagUrl(item.name)}"><div class="team-name-main">${item.name}</div></div></td>
        <td style="text-align:right; color:#555;">${item.pld}</td>
        <td style="text-align:right; color:#555;">${item.pts}</td>
        <td style="text-align:right; font-weight:600;">${rating}</td>
      </tr>`;
    });
    document.getElementById('odiTbody').innerHTML = odiHtml;

    // T20 Table
    let t20Data = getSavedTable('cricket_t20_table', defaultT20Teams);
    t20Data.sort((a, b) => {
      let ratA = a.pld > 0 ? Math.round(a.pts / a.pld) : 0;
      let ratB = b.pld > 0 ? Math.round(b.pts / b.pld) : 0;
      return ratB - ratA;
    });
    let t20Html = '';
    t20Data.forEach((item, index) => {
      let rating = item.pld > 0 ? Math.round(item.pts / item.pld) : 0;
      t20Html += `<tr>
        <td>${index + 1}</td>
        <td><div class="team-info"><img class="flag-img" src="${getTeamFlagUrl(item.name)}"><div class="team-name-main">${item.name}</div></div></td>
        <td style="text-align:right; color:#555;">${item.pld}</td>
        <td style="text-align:right; color:#555;">${item.pts}</td>
        <td style="text-align:right; font-weight:600;">${rating}</td>
      </tr>`;
    });
    document.getElementById('t20Tbody').innerHTML = t20Html;

    updateAdminDropdowns();
  }
