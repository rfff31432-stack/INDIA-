<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Rankings & Groups</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f4f5;
      color: #333;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding-bottom: 50px;
    }

    /* Top Bar */
    .top-bar {
      background-color: #0b9e78;
      color: white;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid white;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* Main Navigation Tabs */
    .nav-tabs {
      background-color: #0b9e78;
      display: flex;
      justify-content: space-around;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding-bottom: 4px;
      user-select: none;
    }

    .tab.active {
      color: #ffffff;
      border-bottom: 3px solid #ffffff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Sub Tabs (TEST, ODI, T20) */
    .sub-tabs-container {
      display: flex;
      justify-content: center;
      background-color: #ffffff;
      padding: 12px;
      gap: 5px;
      border-bottom: 1px solid #e0e0e0;
    }

    .sub-tab {
      border: 2px solid #0b9e78;
      color: #0b9e78;
      padding: 6px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border-radius: 2px;
      background: white;
      user-select: none;
    }

    .sub-tab.active {
      background-color: #0b9e78;
      color: white;
    }

    .sub-content {
      display: none;
    }

    .sub-content.active {
      display: block;
    }

    /* Rankings & Groups Table Styling */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 12px;
      white-space: nowrap;
    }

    .rank-table th {
      color: #777;
      text-align: left;
      padding: 10px 8px;
      font-weight: 600;
      font-size: 11px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }

    .rank-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #f2f2f2;
      color: #222;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name-main {
      font-weight: 600;
      font-size: 13px;
      color: #111;
    }

      width: 22px;
      height: 15px;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 0 0 2px rgba(0,0,0,0.
