<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced ICC Cricket Scoring & Rankings System</title>
    <style>
        :root {
            --primary: #1a237e;
            --secondary: #00897b;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        .score-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ICC Cricket Management & Scoring System</h1>

    <!-- Match Setup Card -->
    <div class="card">
        <h2>Match Configuration</h2>
        <div class="form-group">
            <label for="matchFormat">Select Format:</label>
            <select id="matchFormat" onchange="updateTeamsAndInnings()">
                <option value="Test">Test (WTC - 9 Teams)</option>
                <option value="ODI">ODI (Top 18 Teams)</option>
                <option value="T20I">T20I (Top 17 Teams)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="teamASelect">Team A:</label>
            <select id="teamASelect"></select>
        </div>

        <div class="form-group">
            <label for="teamBSelect">Team B:</label>
            <select id="teamBSelect"></select>
        </div>

        <!-- Dynamic Match Result / Toss Section -->
        <div class="form-group" id="tossResultSection">
            <label id="tossResultLabel" for="matchResultInput">Match Result (e.g., India won by 5 wickets / 50 runs):</label>
            <input type="text" id="matchResultInput" placeholder="Enter result if match concluded, else leave blank">
        </div>
    </div>

    <!-- Live Scoring Card (Team Score Above Team Name) -->
    <div class="card">
        <h2>Live Scorecard</h2>
        
        <!-- Team A Section -->
        <div class="score-box">
            <label id="labelTeamAScore" style="font-size: 18px; color: var(--primary);">Team A Score:</label>
            <input type="text" id="teamAScoreInput" placeholder="e.g. 285/4 (45.2 Overs)" style="margin-bottom: 10px;">
            <h3 id="displayTeamAName">Team A</h3>
        </div>

        <!-- Team A Innings 2 (Visible only for Test) -->
        <div class="score-box" id="teamAInnings2Box" style="display:none;">
            <label style="font-size: 18px; color: var(--primary);">Team A - 2nd Innings Score:</label>
            <input type="text" id="teamAInnings2Input" placeholder="e.g. 190/8 (60 Overs)">
        </div>

        <hr style="margin: 20px 0;">

        <!-- Team B Section -->
        <div class="score-box">
            <label id="labelTeamBScore" style="font-size: 18px; color: var(--primary);">Team B Score:</label>
            <input type="text" id="teamBScoreInput" placeholder="e.g. 240/10 (40.1 Overs)" style="margin-bottom: 10px;">
            <h3 id="displayTeamBName">Team B</h3>
        </div>

        <!-- Team B Innings 2 (Visible only for Test) -->
        <div class="score-box" id="teamBInnings2Box" style="display:none;">
            <label style="font-size: 18px; color: var(--primary);">Team B - 2nd Innings Score:</label>
            <input type="text" id="teamBInnings2Input" placeholder="e.g. 150/4 (45 Overs)">
        </div>

        <button onclick="saveMatchData()" style="margin-top: 20px;">Update Match & Standings</button>
    </div>

    <!-- Global Points Table Card -->
    <div class="card">
        <h2 id="tableTitle">ICC Global Rankings Table</h2>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team</th>
                    <th>Rating</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody id="rankingTableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ICC Teams Database according to your specific requirements
    const iccTeams = {
        Test: [
            { name: "Australia", rating: 131, points: 3138 },
            { name: "South Africa", rating: 119, points: 2256 },
            { name: "New Zealand", rating: 106, points: 2336 },
            { name: "India", rating: 104, points: 2714 },
            { name: "England", rating: 99, points: 3158 },
            { name: "Sri Lanka", rating: 76, points: 1222 },
            { name: "Pakistan", rating: 75, points: 1427 },
            { name: "West Indies", rating: 74, points: 2008 },
            { name: "Bangladesh", rating: 73, points: 1539 }
        ],
        ODI: [
            { name: "India", rating: 116, points: 3841 },
            { name: "New Zealand", rating: 109, points: 3809 },
            { name: "Australia", rating: 102, points: 2965 },
            { name: "South Africa", rating: 102, points: 2855 },
            { name: "Pakistan", rating: 100, points: 3215 },
            { name: "Sri Lanka", rating: 96, points: 3470 },
            { name: "England", rating: 93, points: 2898 },
            { name: "Afghanistan", rating: 92, points: 2565 },
            { name: "Bangladesh", rating: 83, points: 3251 },
            { name: "West Indies", rating: 77, points: 2624 },
            { name: "Zimbabwe", rating: 63, points: 941 },
            { name: "Ireland", rating: 51, points: 815 },
            { name: "Scotland", rating: 45, points: 1260 },
            { name: "Netherlands", rating: 44, points: 1309 },
            { name: "USA", rating: 40, points: 1035 },
            { name: "Oman", rating: 33, points: 716 },
            { name: "Namibia", rating: 31, points: 623 },
            { name: "Nepal", rating: 25, points: 790 }
        ],
        T20I: [
            { name: "India", rating: 268, points: 16366 },
            { name: "England", rating: 268, points: 10186 },
            { name: "Australia", rating: 260, points: 9868 },
            { name: "New Zealand", rating: 247, points: 12348 },
            { name: "South Africa", rating: 244, points: 11717 },
            { name: "Pakistan", rating: 240, points: 13679 },
            { name: "West Indies", rating: 234, points: 13079 },
            { name: "Bangladesh", rating: 224, points: 11860 },
            { name: "Sri Lanka", rating: 221, points: 9703 },
            { name: "Afghanistan", rating: 220, points: 7935 },
            { name: "Ireland", rating: 205, points: 5942 },
            { name: "Zimbabwe", rating: 201, points: 10875 },
            { name: "USA", rating: 183, points: 3650 },
            { name: "Netherlands", rating: 180, points: 4311 },
            { name: "Nepal", rating: 179, points: 7699 },
            { name: "Scotland", rating: 179, points: 4116 },
            { name: "Namibia", rating: 179, points: 6616 }
        ]
    };

    function updateTeamsAndInnings() {
        const format = document.getElementById('matchFormat').value;
        const teamASelect = document.getElementById('teamASelect');
        const teamBSelect = document.getElementById('teamBSelect');
        
        teamASelect.innerHTML = '';
        teamBSelect.innerHTML = '';

        const teams = iccTeams[format];
        teams.forEach((team, index) => {
            teamASelect.innerHTML += `<option value="${team.name}">${team.name}</option>`;
            teamBSelect.innerHTML += `<option value="${team.name}" ${index === 1 ? 'selected' : ''}>${team.name}</option>`;
        });

        // Show/Hide Test 2nd Innings fields
        const isTest = (format === 'Test');
        document.getElementById('teamAInnings2Box').style.display = isTest ? 'block' : 'none';
        document.getElementById('teamBInnings2Box').style.display = isTest ? 'block' : 'none';

        loadRankingsTable(format);
        updateDisplayNames();
    }

    function loadRankingsTable(format) {
        const tbody = document.getElementById('rankingTableBody');
        tbody.innerHTML = '';
        document.getElementById('tableTitleinnerText') = `ICC Global ${format} Rankings`;

        const teams = iccTeams[format];
        teams.forEach((team, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td><b>${team.name}</b></td>
                    <td>${team.rating}</td>
                    <td>${team.points}</td>
                </tr>
            `;
        });
    }

    function updateDisplayNames() {
        document.getElementById('displayTeamAName').innerText = document.getElementById('teamASelect').value;
        document.getElementById('displayTeamBName').innerText = document.getElementById('teamBSelect').value;
        document.getElementById('labelTeamAScore').innerText = document.getElementById('teamASelect').value + " Score:";
        document.getElementById('labelTeamBScore').innerText = document.getElementById('teamBSelect').value + " Score:";
    }

    document.getElementById('teamASelect').addEventListener('change', updateDisplayNames);
    document.getElementById('teamBSelect').addEventListener('change', updateDisplayNames);

    function saveMatchData() {
        const resultInput = document.getElementById('matchResultInput').value.trim();
        if(resultInput) {
            // Dynamic text change when result is given
            document.getElementById('tossResultLabel').innerText = "Match Concluded Result:";
        }
        alert("Match details and scoreboard updated successfully!");
    }

    // Initial Load
    window.onload = function() {
        updateTeamsAndInnings();
    };
</script>

</body>
</html>
