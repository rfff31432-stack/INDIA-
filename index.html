 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICC Cricket Scoring & Match Center</title>
    <style>
        :root {
            --primary-color: #1b263b;
            --secondary-color: #0d9488;
            --accent-color: #f97316;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #475569;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        /* Match Card & Score Styling */
        .match-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .teams-score-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
            text-align: center;
        }
        .team-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
        }
        .team-score-val {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .team-name-val {
            font-size: 16px;
            font-weight: 600;
        }
        .vs-badge {
            font-weight: bold;
            color: #64748b;
            font-size: 18px;
        }
        .match-result-display {
            margin-top: 15px;
            text-align: center;
            background: rgba(13, 148, 136, 0.2);
            border: 1px solid var(--secondary-color);
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            color: #2dd4bf;
        }
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ICC Cricket Match Center & Rankings</h1>

    <!-- Setup Card -->
    <div class="card">
        <h2>Match & Team Setup</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="matchFormat">Match Format:</label>
                <select id="matchFormat" onchange="handleFormatChange()">
                    <option value="Test">Test (WTC - 9 Teams)</option>
                    <option value="ODI">ODI (Top 18 Teams)</option>
                    <option value="T20I">T20I (Top 17 Teams)</option>
                </select>
            </div>
            <div class="form-group" id="tossResultControlGroup">
                <label id="dynamicInputLabel" for="matchStatusInput">Match Result / Toss Status:</label>
                <input type="text" id="matchStatusInput" placeholder="e.g. India won the toss and elected to bat">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="teamASelect">Select Team A:</label>
                <select id="teamASelect" onchange="updateLivePreview()"></select>
            </div>
            <div class="form-group">
                <label for="teamBSelect">Select Team B:</label>
                <select id="teamBSelect" onchange="updateLivePreview()"></select>
            </div>
        </div>
    </div>

    <!-- Live Scoring Controls Card -->
    <div class="card">
        <h2>Live Scoring Input</h2>
        <div class="form-row">
            <div class="form-group">
                <label id="labelTeamAScore">Team A Score:</label>
                <input type="text" id="teamAScoreInput" placeholder="e.g. 295/6 (50 Overs)" oninput="updateLivePreview()">
            </div>
            <div class="form-group">
                <label id="labelTeamBScore">Team B Score:</label>
                <input type="text" id="teamBScoreInput" placeholder="e.g. 210/10 (38.4 Overs)" oninput="updateLivePreview()">
            </div>
        </div>

        <!-- Test 2nd Innings Inputs (Only visible for Test) -->
        <div class="form-row" id="testInnings2Row" style="display: none;">
            <div class="form-group">
                <label>Team A - 2nd Innings Score:</label>
                <input type="text" id="teamAInng2Input" placeholder="e.g. 180/4 (45 Overs)" oninput="updateLivePreview()">
            </div>
            <div class="form-group">
                <label>Team B - 2nd Innings Score:</label>
                <input type="text" id="teamBInng2Input" placeholder="e.g. 145/10 (39 Overs)" oninput="updateLivePreview()">
            </div>
        </div>

        <button onclick="publishMatchData()">Publish / Update Match Card</button>
    </div>

    <!-- Match Card Preview Section -->
    <div class="match-card">
        <div class="match-header">
            <span id="cardFormatLabel">ODI Match</span>
            <span id="cardStatusLabel">Live / Scheduled</span>
        </div>
        <div class="teams-score-container">
            <div class="team-box">
                <div class="team-score-val" id="previewTeamAScore">---</div>
                <div class="team-name-val" id="previewTeamAName">Team A</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="team-box">
                <div class="team-score-val" id="previewTeamBScore">---</div>
                <div class="team-name-val" id="previewTeamBName">Team B</div>
            </div>
        </div>
        <div class="match-result-display" id="previewResultDisplay">
            Toss: Match yet to begin
        </div>
    </div>

    <!-- Points Table / Rankings Card -->
    <div class="card" style="margin-top: 20px;">
        <h2 id="tableHeading">ICC Rankings Table</h2>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team Name</th>
                    <th>Rating</th>
                    <th>Total Points</th>
                </tr>
            </thead>
            <tbody id="rankingsTableBody">
                <!-- Populated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Official Teams Database
    const iccDatabase = {
        Test: [
            { name: "Australia", rating: 131, points: 3138 },
            { name: "South Africa", rating: 119, points: 2256 },
            { name: "New Zealand", rating: 106, points: 2336 },
            { name: "India", rating: 104, points: 2714 },
            { name: "England", rating: 99, points: 3158 },
            { name: "Sri Lanka", rating: 76, points: 1222 },
            { name: "Pakistan", rating: 75, points: 1427 },
            { name: "West Indies", rating: 74, points: 2008 },
            { name: "Bangladesh", rating: 73, points: 1539 }
        ],
        ODI: [
            { name: "India", rating: 116, points: 3841 },
            { name: "New Zealand", rating: 109, points: 3809 },
            { name: "Australia", rating: 102, points: 2965 },
            { name: "South Africa", rating: 102, points: 2855 },
            { name: "Pakistan", rating: 100, points: 3215 },
            { name: "Sri Lanka", rating: 96, points: 3470 },
            { name: "England", rating: 93, points: 2898 },
            { name: "Afghanistan", rating: 92, points: 2565 },
            { name: "Bangladesh", rating: 83, points: 3251 },
            { name: "West Indies", rating: 77, points: 2624 },
            { name: "Zimbabwe", rating: 63, points: 941 },
            { name: "Ireland", rating: 51, points: 815 },
            { name: "Scotland", rating: 45, points: 1260 },
            { name: "Netherlands", rating: 44, points: 1309 },
            { name: "USA", rating: 40, points: 1035 },
            { name: "Oman", rating: 33, points: 716 },
            { name: "Namibia", rating: 31, points: 623 },
            { name: "Nepal", rating: 25, points: 790 }
        ],
        T20I: [
            { name: "India", rating: 268, points: 16366 },
            { name: "England", rating: 268, points: 10186 },
            { name: "Australia", rating: 260, points: 9868 },
            { name: "New Zealand", rating: 247, points: 12348 },
            { name: "South Africa", rating: 244, points: 11717 },
            { name: "Pakistan", rating: 240, points: 13679 },
            { name: "West Indies", rating: 234, points: 13079 },
            { name: "Bangladesh", rating: 224, points: 11860 },
            { name: "Sri Lanka", rating: 221, points: 9703 },
            { name: "Afghanistan", rating: 220, points: 7935 },
            { name: "Ireland", rating: 205, points: 5942 },
            { name: "Zimbabwe", rating: 201, points: 10875 },
            { name: "USA", rating: 183, points: 3650 },
            { name: "Netherlands", rating: 180, points: 4311 },
            { name: "Nepal", rating: 179, points: 7699 },
            { name: "Scotland", rating: 179, points: 4116 },
            { name: "Namibia", rating: 179, points: 6616 }
        ]
    };

    function handleFormatChange() {
        const format = document.getElementById('matchFormat').value;
        const teamASelect = document.getElementById('teamASelect');
        const teamBSelect = document.getElementById('teamBSelect');

        teamASelect.innerHTML = '';
        teamBSelect.innerHTML = '';

        const teams = iccDatabase[format];
        teams.forEach((team, idx) => {
            teamASelect.innerHTML += `<option value="${team.name}">${team.name}</option>`;
            teamBSelect.innerHTML += `<option value="${team.name}" ${idx === 1 ? 'selected' : ''}>${team.name}</option>`;
        });

        // Show/Hide Test 2nd innings field
        const isTest = (format === 'Test');
        document.getElementById('testInnings2Row').style.display = isTest ? 'grid' : 'none';

        loadRankingsTable(format);
        updateLivePreview();
    }

    function loadRankingsTable(format) {
        const tbody = document.getElementById('rankingsTableBody');
        tbody.innerHTML = '';
        document.getElementById('tableHeading').innerText = `ICC Global ${format} Rankings`;

        const teams = iccDatabase[format];
        teams.forEach((team, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><b>${team.name}</b></td>
                    <td>${team.rating}</td>
                    <td>${team.points}</td>
                </tr>
            `;
        });
    }

    function updateLivePreview() {
        const format = document.getElementById('matchFormat').value;
        const teamA = document.getElementById('teamASelect').value;
        const teamB = document.getElementById('teamBSelect').value;

        // Labels update
        document.getElementById('labelTeamAScore').innerText = `${teamA} Score:`;
        document.getElementById('labelTeamBScore').innerText = `${teamB} Score:`;

        // Card Names update
        document.getElementById('previewTeamAName').innerText = teamA;
        document.getElementById('previewTeamBName').innerText = teamB;
        document.getElementById('cardFormatLabel').innerText = `${format} Match Center`;

        // Scores update (with Test 2 innings support)
        let scoreA = document.getElementById('teamAScoreInput').value || 'Yet to bat';
        let scoreB = document.getElementById('teamBScoreInput').value || 'Yet to bat';

        if(format === 'Test') {
            const inng2A = document.getElementById('teamAInng2Input').value;
            const inng2B = document.getElementById('teamBInng2Input').value;
            if(inng2A) scoreA += ` & ${inng2A}`;
            if(inng2B) scoreB += ` & ${inng2B}`;
        }

        document.getElementById('previewTeamAScore').innerText = scoreA;
        document.getElementById('previewTeamBScore').innerText = scoreB;

        // Dynamic Toss vs Match Result text change logic
        const statusInput = document.getElementById('matchStatusInput').value.trim();
        const labelElem = document.getElementById('dynamicInputLabel');
        const resultDisplay = document.getElementById('previewResultDisplay');

        if(statusInput.toLowerCase().includes('won by') || statusInput.toLowerCase().includes('won') && (statusInput.includes('runs') || statusInput.includes('wickets') || statusInput.includes('innings'))) {
            labelElem.innerText = "Match Concluded Result:";
            resultDisplay.innerText = "Result: " + statusInput;
            resultDisplay.style.borderColor = "#f97316";
            resultDisplay.style.color = "#fdba74";
        } else if(statusInput) {
            labelElem.innerText = "Match Status / Toss:";
            resultDisplay.innerText = statusInput;
            resultDisplay.style.borderColor = "var(--secondary-color)";
            resultDisplay.style.color = "#2dd4bf";
        } else {
            labelElem.innerText = "Match Status / Toss:";
            resultDisplay.innerText = "Toss: Match in progress or yet to start";
        }
    }

    document.getElementById('matchStatusInput').addEventListener('input', updateLivePreview);

    function publishMatchData() {
        updateLivePreview();
        alert("Match card and scoreboard updated successfully!");
    }

    // Initial setup on window load
    window.onload = function() {
        handleFormatChange();
    };
</script>

</body>
</html>
